<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Drift — Màn hình chờ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #060a13;
    --bg-panel: #0d1626;
    --cyan: #4fe3ff;
    --magenta: #ff3f8e;
    --text-primary: #eef3fb;
    --text-muted: #6f81a0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .horizon {
    position: absolute;
    left: 50%;
    bottom: -20%;
    width: 160%;
    height: 60%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(79,227,255,0.10) 0%, rgba(79,227,255,0.04) 35%, transparent 70%);
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(6,10,19,0.55) 85%, rgba(6,10,19,0.92) 100%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px;
    width: 100%;
    max-width: 640px;
  }

  .title-block { margin-bottom: 64px; }

  h1.game-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--text-primary);
    line-height: 1.15;
    text-shadow:
      0 0 18px rgba(79,227,255,0.45),
      0 0 46px rgba(255,63,142,0.18);
  }

  h1.game-title .drift {
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.tagline {
    margin: 14px 0 0;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }

  /* Start button: hexagonal sci-fi control, not a default rounded card */
  .start-btn {
    position: relative;
    width: 168px;
    height: 168px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .hex {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    background: linear-gradient(160deg, #101c30 0%, #0b1220 70%);
    border: 1px solid rgba(79,227,255,0.35);
    transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    box-shadow: 0 0 0 rgba(79,227,255,0);
  }

  .ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(79,227,255,0.18);
    animation: spin 14s linear infinite;
  }
  .ring::before, .ring::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    top: -3px;
    left: calc(50% - 3px);
    box-shadow: 0 0 8px var(--cyan);
  }
  .ring::after {
    top: auto;
    bottom: -3px;
    background: var(--magenta);
    box-shadow: 0 0 8px var(--magenta);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-label {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.14em;
    color: var(--text-primary);
    transition: color .2s ease, letter-spacing .2s ease;
  }

  .start-btn:hover .hex,
  .start-btn:focus-visible .hex {
    border-color: var(--cyan);
    box-shadow: 0 0 34px rgba(79,227,255,0.35), inset 0 0 24px rgba(79,227,255,0.12);
    transform: scale(1.03);
  }
  .start-btn:hover .btn-label,
  .start-btn:focus-visible .btn-label { letter-spacing: 0.2em; }

  .start-btn:active .hex { transform: scale(0.97); }

  .start-btn:focus-visible { outline: none; }
  .start-btn:focus-visible .ring { border-color: var(--cyan); }

  .footer {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 18px;
    color: var(--text-muted);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .footer .divider { width: 1px; height: 12px; background: rgba(111,129,160,0.4); }

  .warp-flash {
    position: fixed;
    inset: 0;
    background: var(--text-primary);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  .launch-msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  .launch-msg.show { opacity: 1; }
  .launch-msg p {
    font-family: 'Orbitron', sans-serif;
    color: var(--text-primary);
    font-size: 1.4rem;
    letter-spacing: 0.08em;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
  }
</style>
</head>
<body>

<div class="scene">
  <canvas id="stars"></canvas>
  <div class="horizon"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="title-block">
      <h1 class="game-title">STELLAR<br><span class="drift">DRIFT</span></h1>
      <p class="tagline">Chuyến du hành xuyên vành đai tiểu hành tinh</p>
    </div>

    <button class="start-btn" id="startBtn" aria-label="Bắt đầu trò chơi">
      <span class="ring" aria-hidden="true"></span>
      <span class="hex" aria-hidden="true"></span>
      <span class="btn-label">BẮT ĐẦU</span>
    </button>

    <div class="footer">
      <span>v1.0.2</span>
      <span class="divider"></span>
      <span id="hint">Mẹo: giữ phím cách để tăng tốc</span>
    </div>
  </div>
</div>

<div class="warp-flash" id="flash"></div>
<div class="launch-msg" id="launchMsg"><p>ĐANG VÀO QUỸ ĐẠO...</p></div>

<script>
  // Starfield background
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, stars, warp = false;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeStars(count) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      arr.push({
        x: (Math.random() - 0.5) * w,
        y: (Math.random() - 0.5) * h,
        z: Math.random() * w,
        o: Math.random() * 0.6 + 0.3
      });
    }
    return arr;
  }
  stars = makeStars(420);

  function draw() {
    ctx.fillStyle = '#060a13';
    ctx.fillRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const speed = warp ? 38 : 1.1;

    for (const s of stars) {
      s.z -= speed;
      if (s.z <= 0) {
        s.x = (Math.random() - 0.5) * w;
        s.y = (Math.random() - 0.5) * h;
        s.z = w;
      }

      const k = w / s.z;
      const px = cx + s.x * k;
      const py = cy + s.y * k;

      if (px < 0 || px >= w || py < 0 || py >= h) continue;

      const size = (1 - s.z / w) * 2.4;
      const alpha = s.o * (1 - s.z / w);

      if (warp) {
        const prevK = w / (s.z + speed);
        const ppx = cx + s.x * prevK;
        const ppy = cy + s.y * prevK;
        ctx.strokeStyle = `rgba(150,215,255,${Math.min(alpha * 1.6, 0.9)})`;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(ppx, ppy);
        ctx.lineTo(px, py);
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(230,240,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();

  // Start button behavior
  const startBtn = document.getElementById('startBtn');
  const flash = document.getElementById('flash');
  const launchMsg = document.getElementById('launchMsg');

  startBtn.addEventListener('click', () => {
    if (warp) return;
    warp = true;
    startBtn.disabled = true;

    setTimeout(() => {
      flash.style.transition = 'opacity .15s ease';
      flash.style.opacity = '1';
      launchMsg.classList.add('show');
      setTimeout(() => { flash.style.opacity = '0'; }, 180);
    }, 650);

    // Đây là nơi bạn chuyển sang màn chơi thật, ví dụ:
    // setTimeout(() => { window.location.href = 'game.html'; }, 1400);
  });
</script>

</body>
</html>
